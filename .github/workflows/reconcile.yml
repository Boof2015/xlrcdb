name: Reconcile

# Single serialized job that owns the index. It normalizes any incoming/*.xlrc
# (assigns IDs, moves them under tracks/, auto-creates artists) and regenerates
# index/ from the canonical data, then commits to main. Because the index is
# only ever generated here (never in PRs), submissions can't conflict on it and
# fork PRs work normally (nothing is pushed to a contributor's fork).
on:
  push:
    branches:
      - main
    paths:
      - "incoming/**"
      - "artists/**"
      - "tracks/**"
  schedule:
    # Backstop: catches anything an on-merge run missed (~ every 15 minutes).
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Only used if XLRCDB_BOT_TOKEN is missing: the "it's live" note falls back to GITHUB_TOKEN.
  issues: write
  pull-requests: write

# Never run two reconciles at once: each operates on the latest main and the
# commits stay linear, so there are no index merge conflicts.
concurrency:
  group: reconcile-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # normalizeIncoming validates the repo, processes incoming, and regenerates
      # the index in one pass; it exits non-zero on invalid data (no commit then).
      - name: Normalize and regenerate index
        env:
          # Outside the repo on purpose: the commit step below runs `git add -A`.
          XLRCDB_CREATED_OUT: ${{ runner.temp }}/created-tracks.json
        run: npm run normalize

      - name: Commit and push reconciled data
        run: |
          # status, not diff: diff ignores brand-new files (like a newly generated index file).
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to reconcile."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] stops this push from re-triggering the push trigger above.
          git commit -m "Reconcile xlrcdb data (normalize + index) [skip ci]"
          git push origin HEAD:main

      # After the push, so the track is on main by the time the contributor follows the link.
      # Best effort: the data is already committed, so a failed comment only warns.
      - name: Tell contributors their tracks are live
        if: success()
        uses: actions/github-script@v7
        env:
          CREATED_TRACKS: ${{ runner.temp }}/created-tracks.json
        with:
          github-token: ${{ secrets.XLRCDB_BOT_TOKEN || github.token }}
          script: |
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const { pathToFileURL } = require("node:url");
            if (!fs.existsSync(process.env.CREATED_TRACKS)) return;
            const created = JSON.parse(fs.readFileSync(process.env.CREATED_TRACKS, "utf8"));
            if (!created.length) return;
            const notices = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/prNotices.js`).href);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const track of created) {
              try {
                // The commit that added the incoming file is the PR's (squash) merge on main.
                const sha = execFileSync("git", ["log", "--diff-filter=A", "--format=%H", "-1", "--", track.incomingPath], { encoding: "utf8" }).trim();
                if (!sha) continue;
                const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                const pull = pulls.find((candidate) => candidate.merged_at) ?? pulls[0];
                if (!pull) continue;
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull.number, per_page: 100 });
                if (comments.some((comment) => comment.body?.includes(notices.liveMarker(track.id)))) continue;
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull.number,
                  body: notices.buildLiveComment({ author: pull.user.login, trackId: track.id, artistId: track.artistId, title: track.title, artist: track.artistName })
                });
                core.info(`Told PR #${pull.number} that ${track.id} is live.`);
              } catch (error) {
                core.warning(`Could not post the live note for ${track.id}: ${error.message}`);
              }
            }
