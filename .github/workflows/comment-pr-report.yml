name: Comment PR Report

# Tells the author what happened when Check finishes on their pull request: what's wrong and
# how to fix it, or, after a fix, that it passes now. Failing contributor submissions get the
# needs-fix label, which stale.yml uses to warn and then close them if nothing changes.
#
# Runs as workflow_run so it can comment on pull requests from forks. Comments come from
# xlrcdb-bot (XLRCDB_BOT_TOKEN), the account that also merges; GITHUB_TOKEN is the fallback if
# the secret is missing, so notices still go out.
#
# The report artifact is produced by the PR's own Check run, so it is untrusted data: a PR can
# change the scripts that write it. The wording comes from src/prNotices.js on main (checked
# out below), which only quotes that data.
on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Download PR gate report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-gate-report
          path: pr-gate-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.XLRCDB_BOT_TOKEN || github.token }}
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const notices = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/src/prNotices.js`).href);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            // Which PR this Check run belongs to. For fork PRs (nearly every real submission)
            // workflow_run.pull_requests is empty and the associated-commit lookup misses the
            // fork's head commit, so fall back to matching an open PR by head SHA.
            let number = run.pull_requests?.find((pull) => pull.number)?.number;
            if (!number) {
              const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner, repo, commit_sha: run.head_sha, per_page: 100
              }).catch(() => []);
              number = associated.find((pull) => pull.state === "open")?.number;
            }
            if (!number) {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              number = open.find((pull) => pull.head.sha === run.head_sha)?.number;
            }
            if (!number) {
              core.warning(`No open pull request found for Check run ${run.id} at ${run.head_sha}.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pull.state !== "open") return;
            if (pull.head.sha !== run.head_sha) {
              core.info(`PR #${number} moved on from ${run.head_sha}; the newer Check will report.`);
              return;
            }

            const read = (name) => {
              try {
                return fs.readFileSync(`pr-gate-report/${name}`, "utf8");
              } catch {
                return "";
              }
            };
            let classification = null;
            try {
              classification = JSON.parse(read("classification.json"));
            } catch {}
            const kind = typeof classification?.kind === "string" ? classification.kind : "unknown";
            const errors = notices.parseGateErrors({
              classification,
              logs: [read("classify.log"), read("validate-raw.log"), read("normalize-dry-run.log")]
            });
            const author = pull.user.login;
            const maintainer = ["OWNER", "MEMBER", "COLLABORATOR"].includes(pull.author_association);
            // Only contributor submissions are closed when they go stale; maintainers' PRs and
            // anything waiting on a maintainer are left alone.
            const staleEligible = !maintainer && kind !== "manual-review";

            // Our earlier comment, found by marker, but only if this bot (or the Actions bot
            // that used to post it) wrote it, so a copied marker can't hijack the thread.
            let me = "";
            try {
              me = (await github.rest.users.getAuthenticated()).data.login;
            } catch {}
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find((comment) => (
              comment.body?.includes(notices.FAILURE_MARKER) &&
              (comment.user?.type === "Bot" || (me && comment.user?.login === me))
            ));

            if (run.conclusion === "success") {
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: notices.buildPassedComment({ author }) });
              }
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: notices.NEEDS_FIX_LABEL }).catch(() => {});
              return;
            }
            if (run.conclusion !== "failure") return; // cancelled / skipped: say nothing

            const body = notices.buildFailureComment({ author, kind, errors, report: read("report.md"), staleClose: staleEligible });
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

            if (staleEligible) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: notices.NEEDS_FIX_LABEL });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner, repo, name: notices.NEEDS_FIX_LABEL, color: "d93f0b",
                    description: `Checks failed; closed after ${notices.STALE_CLOSE_DAYS} days without an update`
                  }).catch((createError) => core.warning(`Could not create label: ${createError.message}`));
                }
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [notices.NEEDS_FIX_LABEL] })
                .catch((error) => core.warning(`Could not label PR #${number}: ${error.message}`));
            }
