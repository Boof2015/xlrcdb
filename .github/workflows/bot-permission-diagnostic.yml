name: Bot Permission Diagnostic

# TEMPORARY. Probes whether the App can merge a NON-FORK PR, to isolate whether
# the 403 on PR #21 was fork-specific. contents:write is already proven working.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to attempt merging
        required: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Mint bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.XLRCDB_BOT_APP_ID }}
          private-key: ${{ secrets.XLRCDB_BOT_PRIVATE_KEY }}

      - name: Attempt merge
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ inputs.pr }}
        run: |
          set +e
          gh api -X PUT "/repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method=squash -i > out.txt 2>&1
          set -e
          echo "--- status ---"; head -1 out.txt
          echo "--- expected perms ---"; grep -i 'x-accepted-github' out.txt || echo "(none)"
          echo "--- body ---"; grep -i '"message"\|"merged"' out.txt || tail -2 out.txt
