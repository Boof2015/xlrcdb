name: Bot Token Smoke Test

# TEMPORARY - delete once it has passed once.
#
# Proves three things that can't be checked from a user token:
#   1. XLRCDB_BOT_PRIVATE_KEY actually matches XLRCDB_BOT_APP_ID (mint succeeds)
#   2. The App is installed on this repository (it appears in the listing)
#   3. The App has Actions: write (the Reconcile dispatch is accepted)
#
# Nothing here mutates data. The dispatched Reconcile no-ops when incoming/ is
# empty and index/ is already current.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Mint bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.XLRCDB_BOT_APP_ID }}
          private-key: ${{ secrets.XLRCDB_BOT_PRIVATE_KEY }}

      - name: Report identity and installation
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          echo "Token minted for app-id ${{ vars.XLRCDB_BOT_APP_ID }}."
          echo "Acting as: $(gh api /user --jq .login 2>/dev/null || echo '<installation token, no user>')"
          echo "Installed on:"
          gh api /installation/repositories --jq '.repositories[].full_name' | sed 's/^/  - /'

      - name: Verify Actions write permission
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          # Same call auto-merge makes after a successful merge.
          gh api -X POST /repos/${{ github.repository }}/actions/workflows/reconcile.yml/dispatches \
            -f ref=main
          echo "Actions: write confirmed (Reconcile dispatch accepted)."
