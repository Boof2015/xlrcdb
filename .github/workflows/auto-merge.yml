name: Auto-merge

# A green Check means the PR is a clean, valid data submission (classify gates
# scope, validate gates format). Merge it; the Reconcile workflow then normalizes
# and regenerates the index on main. Runs as workflow_run so it has upstream write
# permissions even for pull requests opened from forks.
#
# This is format validation only. Nothing here reviews the lyrics or checks who
# holds rights to them, and a merge is not an endorsement of the content (see
# LEGAL.md). The only other gate is a content-neutral per-author daily merge cap
# (spam throttle, not content curation). Maintainers are exempt. Tune via the
# DAILY_MERGE_CAP repository variable (default 30).
on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Serialized across every PR, not per head SHA. Check only ever sees its own branch, so two
# submissions of the same track pass independently; the pre-merge revalidation below is what
# catches that, and it is only sound if one merge finishes (and lands on main) before the next
# one revalidates.
concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DAILY_MERGE_CAP: ${{ vars.DAILY_MERGE_CAP }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge clean data PR
        uses: actions/github-script@v7
        with:
          # Merge as the xlrcdb-bot machine account, never as a maintainer: these
          # merges are automated and carry no human judgement about the lyrics, so
          # they must not appear under a person's name as though that person
          # reviewed them.
          #
          # This must be a classic PAT from that account, not a GitHub App token and
          # not GITHUB_TOKEN. Both of those are scoped to this repository and get
          # 403 "Resource not accessible by integration" merging pull requests
          # opened from forks - which is nearly every real submission. A user token
          # can merge any PR targeting a repo the account can write to. Verified:
          # an App token merged a same-repo PR fine and failed on a fork PR.
          #
          # Fine-grained PATs cannot be used either: they only reach repositories
          # owned by the selected resource owner, and the bot is a collaborator
          # here rather than the owner.
          #
          # There is deliberately no fallback. An expired or missing token fails
          # this step loudly instead of silently leaving valid PRs unmerged.
          github-token: ${{ secrets.XLRCDB_BOT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const cap = Number(process.env.DAILY_MERGE_CAP) || 30;

            // Resolve the PR this Check run belongs to. For fork PRs,
            // workflow_run.pull_requests is empty and the associated-commit lookup
            // misses the fork's head commit, so fall back to matching an open PR by
            // head SHA (works for same-repo and fork PRs alike).
            let pullNumber = run.pull_requests?.find((pull) => pull.number)?.number;
            if (!pullNumber) {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              pullNumber = open.find((pull) => pull.head.sha === run.head_sha)?.number;
            }
            if (!pullNumber) {
              core.info(`No pull request found for Check run ${run.id}.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pull.state !== "open") { core.info(`PR #${pullNumber} is ${pull.state}.`); return; }
            if (pull.draft) { core.info(`PR #${pullNumber} is a draft.`); return; }
            // Only merge the exact commit that passed Check.
            if (pull.head.sha !== run.head_sha) {
              core.info(`PR #${pullNumber} moved from ${run.head_sha} to ${pull.head.sha}; waiting for the latest Check.`);
              return;
            }

            // Per-author daily cap. Maintainers (owner / member / collaborator) are exempt.
            const trusted = ["OWNER", "MEMBER", "COLLABORATOR"].includes(pull.author_association);
            if (!trusted) {
              const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              const author = pull.user.login;
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:merged author:${author} merged:>=${since}`,
                per_page: 1
              });
              if (search.data.total_count >= cap) {
                core.info(`PR #${pullNumber}: author ${author} hit the daily cap (${search.data.total_count}/${cap}); leaving for manual review.`);
                await notifyCap(pullNumber, author, cap);
                return;
              }
            }

            // Check only ever sees the PR's own branch, so two PRs submitting the same track
            // both go green independently and main may have moved since either ran. Replay
            // this PR's incoming files against main as it stands right now. The concurrency
            // group serializes auto-merges, so "right now" is stable for the length of this
            // job.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pullNumber, per_page: 100
            });
            const incomingFiles = files
              .filter((file) => file.status !== "removed")
              .map((file) => file.filename)
              .filter((name) => name.startsWith("incoming/") && name.endsWith(".xlrc"));

            const staleReport = incomingFiles.length > 0
              ? revalidateAgainstMain(pullNumber, incomingFiles)
              : undefined;
            if (staleReport) {
              core.warning(`PR #${pullNumber} does not validate against current main; leaving it open.`);
              await notifyStale(pullNumber, staleReport);
              return;
            }

            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: pullNumber, merge_method: "squash" });
              core.info(`Merged PR #${pullNumber}.`);
            } catch (error) {
              core.warning(`Could not merge PR #${pullNumber}: ${error.message}`);
              return;
            }

            // A user-token merge is not GITHUB_TOKEN, so the push to main does fire
            // Reconcile's push trigger on its own. Dispatch anyway as a backstop: the
            // reconcile-main concurrency group serializes the runs and a duplicate
            // no-ops. The cron is the last line of defence.
            //
            // This call needs classic scope `repo`; with `public_repo` it 403s. That
            // is harmless - the catch below logs it and the push trigger already ran.
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "reconcile.yml", ref: "main" });
              core.info("Dispatched Reconcile.");
            } catch (error) {
              core.warning(`Could not dispatch Reconcile (cron will catch it): ${error.message}`);
            }

            // Re-run validate:incoming with this PR's submissions applied on top of current
            // main. Returns the failure output, or undefined when the PR is still clean.
            function revalidateAgainstMain(number, paths) {
              const { execFileSync } = require("node:child_process");
              const exec = (command, args) => execFileSync(command, args, { encoding: "utf8" });

              try {
                exec("git", ["fetch", "--no-tags", "--depth=1", "origin", `refs/pull/${number}/head`]);
                // Additive: main's own incoming/ is normally empty because Reconcile drains
                // it, but anything still pending there is validated alongside these files.
                exec("git", ["checkout", "FETCH_HEAD", "--", ...paths]);
              } catch (error) {
                // Could not set the check up at all. That is an infrastructure problem, not a
                // finding about the submission, so it must not silently block a valid PR.
                core.warning(`Could not stage PR #${number} for revalidation: ${error.message}`);
                return undefined;
              }

              try {
                exec("npm", ["run", "--silent", "validate:incoming"]);
                return undefined;
              } catch (error) {
                return `${error.stdout ?? ""}${error.stderr ?? ""}`.trim() || "validate:incoming failed";
              }
            }

            // Leave one comment (and no duplicates) when a PR is held by the cap.
            async function notifyCap(number, author, dailyCap) {
              return notifyOnce(number, "<!-- xlrcdb-rate-limit -->", `Thanks @${author}! You've reached the automatic daily submission limit (${dailyCap}). This PR is valid and will be merged by a maintainer, or it will auto-merge once your recent submissions roll past 24 hours. This is a spam throttle, not a review of the lyrics.`);
            }

            // Leave one comment when a PR passed Check but no longer fits main - almost always
            // because another PR added the same track first.
            async function notifyStale(number, report) {
              return notifyOnce(number, "<!-- xlrcdb-stale-check -->", [
                "This PR passed `Check`, but re-validating it against the current `main` fails, so it was not merged automatically.",
                "",
                "This usually means another pull request added the same track first. `Check` only sees its own branch, so two submissions of one song can both go green independently.",
                "",
                "```",
                report.slice(0, 4000),
                "```",
                "",
                "If the track is already in the database, this PR can be closed. Otherwise, push a fix and `Check` will run again."
              ].join("\n"));
            }

            async function notifyOnce(number, marker, body) {
              const existing = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              if (existing.some((comment) => comment.body?.includes(marker))) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: `${marker}\n${body}` });
            }
